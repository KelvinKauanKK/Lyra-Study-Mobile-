# Gera o APK sem precisar instalar o Flutter no seu computador.
# Uso: suba esta pasta para um repositório no GitHub -> aba Actions -> "Build APK" -> Run workflow -> baixe o artefato lyra-study-apk.
name: Build APK
on:
  workflow_dispatch:
  push:
    branches: [main]
jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Gerar a pasta android/ (não vai no zip) e instalar dependências
        run: |
          flutter create --platforms=android --project-name lyra_study --org br.lyra .
          flutter pub get
      - name: Analisar e testar (paridade com o Python)
        run: |
          flutter analyze --no-fatal-infos --no-fatal-warnings
          flutter test
      - name: Compilar o APK
        run: flutter build apk --release
      - uses: actions/upload-artifact@v4
        with:
          name: lyra-study-apk
          path: build/app/outputs/flutter-apk/app-release.apk
