name: lyra_study
description: Lyra Study mobile - estudos, simulados e a Lyra City (Android).
publish_to: "none"
version: 1.0.0+1

environment:
  sdk: ">=3.3.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  sqflite: ^2.3.3
  path: ^1.9.0
  path_provider: ^2.1.3
  provider: ^6.1.2
  file_picker: ^8.0.0
  open_filex: ^4.4.0
  crypto: ^3.0.3
  archive: ^3.6.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/db/schema.sql
    - assets/tutorial.json
    - assets/city/meta.json
    - assets/city/buildings.json
    - assets/city/buildings/
    - assets/city/cars/
    - assets/city/plazas/
